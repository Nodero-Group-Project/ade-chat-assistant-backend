[project]
name = "ade-chat-assistant-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "groq>=1.6.0",
    "nltk>=3.10.1",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
markers = [
    "live: calls the real Groq and StatsNZ APIs (costs tokens); run with --live",
]

[tool.fastapi]
entrypoint = "app.main:web"
